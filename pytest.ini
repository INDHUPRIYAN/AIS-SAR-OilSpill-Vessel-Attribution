[pytest]
# Every module owns a tests/ directory and two of them declare `tests` as a
# package, so the default prepend import mode collides on the package name and
# aborts collection for the WHOLE repo -- one teammate's layout silently
# disables everyone's tests. importlib mode imports each test file by its path
# and needs no unique basenames, which keeps the module split working.
addopts = --import-mode=importlib -q
# importlib mode does not put the test file's module root on sys.path the way
# prepend mode did, so each module root is declared here instead. This is also
# the only place that states the repo's import roots once, rather than each
# module re-deriving them in a conftest.
pythonpath =
    .
    main_system
    analysis_engines
    scene_service
    metocean_service
    ais_service

testpaths =
    contracts/tests
    main_system/tests
    analysis_engines/tests
    scene_service/tests
    metocean_service/tests
    ais_service/tests
filterwarnings =
    ignore::DeprecationWarning
