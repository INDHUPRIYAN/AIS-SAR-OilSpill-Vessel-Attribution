# Engine C - Attribution scoring weights (handbook §4.4, frozen factor names).
# Shown in the UI and configurable; they must sum to 1.0.
weights:
  proximity:  0.30   # depth of the track inside the origin cloud, density-weighted
  temporal:   0.20   # alignment with the estimated discharge window
  trajectory: 0.20   # course vs slick major axis + path-overlap length
  anomaly:    0.10   # slowdown, course change, loitering
  ais_gap:    0.15   # transmission blackout over the origin window
  prior:      0.05   # vessel type / draft prior

# Filtering gates, applied before scoring (handbook §4.7). They live in this file
# because the frozen CLI passes exactly one config path: --weights.
gates:
  spatial_buffer_km: 5.0      # margin around the high-probability origin region
  temporal_buffer_min: 90     # slack either side of the origin window
  max_axis_offset_deg: 45     # course vs slick major axis, folded to [0, 90]

# Vessel-type prior: how plausible a discharge is before any evidence (handbook §4.8,
# "tanker, bulk carrier > passenger ferry"). Keys are matched case-insensitively.
priors:
  tanker: 1.00
  bulk carrier: 0.80
  cargo: 0.70
  tug: 0.45
  fishing: 0.40
  passenger: 0.20
  ferry: 0.20
  _default: 0.50

# Thresholds behind the behavioural factors.
scoring:
  gap_min_minutes: 15          # a longer silence than this counts as an AIS gap
  gap_saturation_min: 30       # a gap this long over the window scores 1.0
  loiter_speed_kn: 3.0
  slowdown_saturation: 0.5     # a 50% speed drop scores 1.0
  course_change_saturation_deg: 60
  draft_reference_m: 12.0      # draft that neither raises nor lowers the type prior
  draft_influence: 0.15
