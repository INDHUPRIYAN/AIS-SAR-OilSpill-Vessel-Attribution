# FROZEN CONTRACT — shared by TRAINING and INFERENCE alike.
#
# If these constants differ between the two, real-scene performance
# silently collapses (the classic SAR domain-gap failure). Both the
# training prep pipeline and the /detect service MUST read this file;
# neither is allowed to hardcode its own values.
#
# Source: PS26143_Handbook_1_Indhu_Priyan.md, Phase 2 step 3.
# Changing anything here requires re-preparing tiles AND retraining.

version: 1

sar:
  # Sigma0 clip range in dB. Pixels are clipped to [db_min, db_max],
  # then linearly mapped to [0, 1] float32 for the model.
  # Storage on disk is uint8 (0-255) to keep the tile cache small;
  # the uint8 <-> float mapping is exactly this same range.
  db_min: -35.0
  db_max: 0.0

  # Value marking "no data" in source rasters (land mask, scene edge).
  # These pixels are clipped to db_min and excluded from loss.
  nodata_db: -999.0

  # Which band the segmenter consumes (1-indexed, as rasterio).
  #
  # Trujillo ships 2-band rasters. Measured over 12 oil scenes in Part III,
  # comparing mean dB inside the mask against outside:
  #
  #     band 1:  oil -29.13, sea -27.68  ->  damping  1.45 dB   (cross-pol)
  #     band 2:  oil -27.41, sea -19.29  ->  damping  8.12 dB   (co-pol, VV-like)
  #
  # Band 2 it is. 1.45 dB is within speckle noise -- a model trained on band 1
  # would have had almost no signal to learn from, and would have failed
  # quietly rather than loudly. Re-measure with `python -m ml.audit` if the
  # dataset is ever re-prepared.
  primary_band: 2

tiling:
  tile_size: 256          # model input size; batch 12-16 fits 6 GB VRAM at fp16
  stride: 256             # non-overlapping tiles at train time
  inference_overlap: 32   # overlap at inference for seam-free stitching

  # Probability above which a pixel is called oil at inference.
  #
  # Chosen from the measured threshold sweep on the held-out split rather than
  # left at the 0.5 default, because the trade-off is steep and asymmetric:
  #
  #   thr   overall IoU   oil-tile IoU   no-oil tiles firing
  #   0.3      0.225         0.897            19.3%
  #   0.5      0.313         0.878            14.4%
  #   0.6      0.334         0.700            12.6%
  #   0.7      0.354         0.582            10.4%
  #
  # 0.5 keeps oil-tile IoU at 0.878 while 0.6 collapses it to 0.700 for only
  # 1.8 points of false-positive reduction. Recall matters here -- a missed
  # slick ends the investigation, whereas a false positive is filtered later by
  # the screening stage and by attribution's own gates. Re-derive this from
  # `ml.evaluate --sweep` whenever the segmenter is retrained.
  detect_threshold: 0.5

  # Keep a tile if at least this fraction of its pixels are oil.
  min_oil_fraction: 0.01

  # Matched hard negatives per kept oil tile (no-oil tiles drawn from the
  # SAME scene, so the model learns texture, not scene identity).
  hard_negative_ratio: 1.0

  # Tiles to sample from a scene that contains NO oil at all.
  #
  # Without this the ratio above silently discards every look-alike and no-oil
  # scene: `n_neg = round(len(oil_tiles) * ratio)` is 0 when a scene has no oil,
  # so two thirds of Trujillo contributed nothing and the segmenter never saw a
  # look-alike during training. Measured effect of that omission: 27.1% of
  # no-oil test tiles produced a false detection, while IoU on oil tiles was a
  # healthy 0.923. The model could segment oil fine; it had simply never been
  # shown clean water or a look-alike and had no reason to stay quiet on them.
  # Raised from 10 after measuring the effect. At 10 the trainval mix was 34%
  # oil while the test distribution is 9% -- the model saw far more oil than it
  # ever will in reality and duly over-predicted it. Effect of 0 -> 10 was:
  # no-oil tiles firing 27.1% -> 14.4%, false-positive area 15.6% -> 5.9%.
  # 40 brings the training mix to roughly 15% oil, much closer to the real one.
  negatives_per_empty_scene: 40
