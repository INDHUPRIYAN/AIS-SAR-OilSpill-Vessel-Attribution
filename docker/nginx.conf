# OceanTrace frontend server. Mirrors the Vite dev proxy: /api and /health go
# to the backend service so the browser stays same-origin (no CORS, and the
# admin token never crosses an origin boundary).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Layer files (GeoTIFF masks, parquet) can be large.
    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # SPA fallback for react-router routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
